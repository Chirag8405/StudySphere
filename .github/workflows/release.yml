name: CI / Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ── Runs on every push to main (no tag). Compiles only — no signing, no release.
  build-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (compile check)
        run: ./gradlew assembleDebug --no-daemon

  # ── Runs only when a vX.Y.Z tag is pushed. Signs and publishes the release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not in vX.Y.Z format. Aborting."
            exit 1
          fi
          VERSION_NAME="${TAG#v}"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.tag }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk \
             release-output/StudySphere-${{ steps.version.outputs.tag }}.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: "Release ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          files: release-output/StudySphere-${{ steps.version.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README release link
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          infile=README.md
          pattern='\[StudySphere\.apk\]\(https://github\.com/[^)]+/releases/download/v[0-9.]+/StudySphere-v[0-9.]+\.apk\)'
          replacement="[StudySphere.apk](https://github.com/${REPO}/releases/download/${TAG}/StudySphere-${TAG}.apk)"

          if ! grep -Eq "$pattern" "$infile"; then
            echo "::warning::No existing StudySphere.apk release link found in $infile — skipping."
            exit 0
          fi

          match_count=$(grep -Ec "$pattern" "$infile")
          if [ "$match_count" -gt 1 ]; then
            echo "::warning::Found $match_count release links in $infile — updating all."
          fi

          sed -i -E "s#${pattern}#${replacement}#g" "$infile"

      - name: Commit and push README update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README release link to ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:main