name: CI / Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive next version by bumping the patch of the latest vX.Y.Z tag ──
      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          # Find the latest semver tag (vX.Y.Z). Default to v0.0.0 if none exist.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                   | sort -V | tail -n 1 || true)
          LATEST="${LATEST:-v0.0.0}"

          # Strip the 'v' prefix and split into parts.
          VER="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"

          # Bump the patch component.
          PATCH=$(( PATCH + 1 ))
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "latest_tag=$LATEST"  >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG"    >> "$GITHUB_OUTPUT"
          echo "version_name=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

          echo "Latest tag : $LATEST"
          echo "Next tag   : $NEW_TAG"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.new_tag }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk \
             release-output/StudySphere-${{ steps.version.outputs.new_tag }}.apk

      # ── Tag & GitHub Release ───────────────────────────────────────────────
      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: "Release ${{ steps.version.outputs.new_tag }}"
          draft: false
          prerelease: false
          files: release-output/StudySphere-${{ steps.version.outputs.new_tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Update README ──────────────────────────────────────────────────────
      - name: Update README Download link
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          NEW_URL="https://github.com/${REPO}/releases/download/${TAG}/StudySphere-${TAG}.apk"
          NEW_LINE="Stable link : [StudySphere.apk](${NEW_URL})"

          # Replace the line that starts with "Stable link :" inside the ## Download section.
          # If such a line doesn't exist yet, insert it right after the "## Download" heading.
          if grep -q '^Stable link :' README.md; then
            sed -i "s|^Stable link :.*|${NEW_LINE}|" README.md
          else
            # Insert after the "## Download" line
            sed -i "/^## Download/a ${NEW_LINE}" README.md
          fi

      - name: Commit and push README update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README download link to ${{ steps.version.outputs.new_tag }}" \
            || echo "Nothing to commit – README already up to date"
          git push origin HEAD:main