plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

import java.io.FileInputStream
import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveKeystorePath = {
    keystoreProperties.getProperty('KEYSTORE_PATH') ?: System.getenv('KEYSTORE_PATH')
}

def resolveKeystoreFile = {
    def keystorePath = resolveKeystorePath()
    if (!keystorePath) {
        return null
    }
    def keystoreFile = rootProject.file(keystorePath)
    keystoreFile.exists() ? keystoreFile : null
}

// Converts "1.2.3" → 1_002_003 (major * 1_000_000 + minor * 1_000 + patch).
// Must stay in sync with UpdateManager.parseVersionCode().
def computeVersionCode = { String versionName ->
    def parts = versionName.tokenize('.')
    def major = parts.size() > 0 ? parts[0].toInteger() : 0
    def minor = parts.size() > 1 ? parts[1].toInteger() : 0
    def patch = parts.size() > 2 ? parts[2].toInteger() : 0
    return major * 1_000_000 + minor * 1_000 + patch
}

android {
    namespace 'com.studysphere'
    compileSdk 34

    defaultConfig {
        applicationId "com.studysphere"
        minSdk 26
        targetSdk 34

        // VERSION_NAME is set by CI from the git tag (e.g. "1.3.0", v-prefix stripped).
        // Falls back to "1.0.0" for local builds so versionCode is always a sane number.
        def resolvedVersionName = System.getenv("VERSION_NAME")?.replaceFirst(/^v/, "") ?: "1.0.0"
        versionName = resolvedVersionName
        versionCode = computeVersionCode(resolvedVersionName)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def keystoreFile = resolveKeystoreFile()
            if (keystoreFile) {
                storeFile = keystoreFile
            }
            storePassword = keystoreProperties.getProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            keyAlias = keystoreProperties.getProperty('KEY_ALIAS') ?: System.getenv('KEY_ALIAS')
            keyPassword = keystoreProperties.getProperty('KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            if (resolveKeystoreFile()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    testImplementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // WorkManager — background deadline notification scheduling
    implementation 'androidx.work:work-runtime-ktx:2.9.1'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}